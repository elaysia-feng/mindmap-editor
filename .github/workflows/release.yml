name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display tag
        run: |
          echo "TAG=${GITHUB_REF_NAME}"
          echo "SHA=${GITHUB_SHA}"

      - name: Build project zip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="mindmap-editor-${VERSION}.zip"

          zip -r "${ZIP_NAME}" \
            index.html \
            css \
            js \
            README.md \
            LICENSE \
            CHANGELOG.md \
            -x "*.DS_Store" "*/.DS_Store" "*Thumbs.db" "*.log"

          echo "ZIPPED:"
          unzip -l "${ZIP_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MindMap Studio ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 包含

            本次发布包含 **三个产物**：

            | 产物 | 说明 |
            | --- | --- |
            | `Source code (zip)` | 完整源码（含 `.github/workflows`），GitHub 自动生成 |
            | `Source code (tar.gz)` | 完整源码的 tar.gz 包，GitHub 自动生成 |
            | `mindmap-editor-1.0.0.zip` | **项目运行包**：只含 `index.html`、`css/`、`js/`、`README.md`、`LICENSE`、`CHANGELOG.md`，解压后双击 `index.html` 即可，**无需任何构建或服务器** |

            ## 🚀 使用

            1. 在下方 *Assets* 区下载 `mindmap-editor-1.0.0.zip`
            2. 解压到任意目录
            3. **双击 `index.html`** 在浏览器中打开
            4. 数据自动保存在浏览器 `localStorage` 中

            > 推荐使用 **Chrome / Edge / Firefox** 最新版。

            ## ✨ 主要特性

            - 脑图 / Markdown / 分屏三视图双向同步
            - 撤销 / 重做、自动保存到 `localStorage`（schema v2，兼容 v1）
            - 拖拽编辑、滚轮缩放、空白处平移
            - 文件操作：打开 / 导出 Markdown、JSON 备份与恢复
            - 浅色 / 深色主题切换
            - 缩略图、大纲、节点折叠 / 展开
            - 工作流连线（DAG 约束）

            完整功能与快捷键见 [`README.md`](https://github.com/elaysia-feng/mindmap-editor/blob/v1.0.0/README.md)。

            ## 🔗 演示

            <!--
              当前（v1.0.0）**未启用** GitHub Pages。
              如后续要启用：
              1) Settings → Pages → Source 选 `main` 分支的 `/` 根目录
              2) 发布完成后删除本注释块，并在此处填入实际 Pages URL
              占位：
              [GitHub Pages 演示 →](https://github.com/elaysia-feng/mindmap-editor/settings/pages)
            -->

            ## 🪪 许可

            本项目以 **MIT License** 发布，详见 [`LICENSE`](https://github.com/elaysia-feng/mindmap-editor/blob/v1.0.0/LICENSE)。
          files: |
            mindmap-editor-1.0.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
