<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>脑图编辑器 · MindMap</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="map">
  <!-- 动态背景 -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- 画布 -->
  <div id="canvas-viewport">
    <div id="canvas-world">
      <svg id="connections" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <!-- 顶部工具栏 -->
  <header id="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <circle cx="4" cy="6" r="2"/>
          <circle cx="4" cy="18" r="2"/>
          <circle cx="20" cy="6" r="2"/>
          <circle cx="20" cy="18" r="2"/>
          <path d="M12 12 L4 6 M12 12 L4 18 M12 12 L20 6 M12 12 L20 18"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">脑图编辑器</div>
        <div class="brand-sub">MindMap Studio</div>
      </div>
    </div>

    <div class="topbar-center">
      <div class="history-controls" aria-label="历史操作">
        <button class="icon-btn" id="btn-undo" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v1"/></svg>
        </button>
        <button class="icon-btn" id="btn-redo" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v1"/></svg>
        </button>
      </div>
      <div class="mode-switch" role="tablist" aria-label="编辑模式">
        <button class="mode-btn active" type="button" role="tab" aria-selected="true" data-mode="map">脑图</button>
        <button class="mode-btn" type="button" role="tab" aria-selected="false" data-mode="markdown">Markdown</button>
        <button class="mode-btn" type="button" role="tab" aria-selected="false" data-mode="split">分屏</button>
      </div>
    </div>

    <nav class="toolbar">
      <button class="tool-btn" id="btn-add-root" type="button" title="新建子节点 (Tab)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>新建节点</span>
      </button>
      <button class="tool-btn" id="btn-auto-layout" type="button" title="整理布局">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h4a2 2 0 0 1 2 2v7 M15 18h-4a2 2 0 0 1-2-2V9"/></svg>
        <span>整理布局</span>
      </button>
      <button class="tool-btn primary" id="btn-import" type="button" title="打开 Markdown 编辑模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3"/></svg>
        <span>Markdown</span>
      </button>
      <button class="tool-btn" id="btn-open-json" type="button" title="打开 JSON 备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h6 M9 17h6 M9 9h2"/></svg>
        <span>打开 JSON</span>
      </button>
      <button class="tool-btn" id="btn-export-md" type="button" title="导出 Markdown">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4 M17 10l-5 5-5-5 M12 15V3"/></svg>
        <span>导出 MD</span>
      </button>
      <button class="tool-btn" id="btn-export-json" type="button" title="导出 JSON 备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h6 M9 17h6 M9 9h2"/></svg>
        <span>JSON</span>
      </button>
      <button class="tool-btn" id="btn-clear" type="button" title="清空全部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        <span>清空</span>
      </button>
      <div class="tool-divider"></div>
      <button class="tool-btn icon-only" id="btn-theme" type="button" title="切换主题" aria-label="切换主题">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2 M12 21v2 M4.2 4.2l1.4 1.4 M18.4 18.4l1.4 1.4 M1 12h2 M21 12h2 M4.2 19.8l1.4-1.4 M18.4 5.6l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <!-- Markdown 常驻编辑面板：与脑图共享同一份文档状态 -->
  <section id="markdown-panel" aria-label="Markdown 编辑器">
    <div class="markdown-header">
      <div>
        <div class="markdown-title">Markdown</div>
        <div class="markdown-subtitle">编辑结构，脑图会实时同步</div>
      </div>
      <div class="markdown-header-actions">
        <span id="markdown-status" class="markdown-status" aria-live="polite">已同步</span>
        <button class="panel-action" id="md-open-file" type="button" title="打开 Markdown 文件" aria-label="打开 Markdown 文件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6l2 2h8v14H4z"/><path d="M12 11v6 M9 14l3 3 3-3"/></svg>
        </button>
        <button class="panel-action" id="md-export-file" type="button" title="导出当前 Markdown" aria-label="导出当前 Markdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6l2 2h8v14H4z"/><path d="M12 17V9 M9 12l3-3 3 3"/></svg>
        </button>
      </div>
    </div>
    <div class="markdown-editor-shell">
      <div id="md-gutter" class="md-gutter" aria-hidden="true">1</div>
      <textarea id="markdown-editor" spellcheck="false" aria-label="Markdown 内容" placeholder="# 我的脑图主题
## 第一分支
- 想法 1
- 想法 2
  - 细节 A"></textarea>
    </div>
    <div id="markdown-error" class="markdown-error hidden" role="alert"></div>
    <div class="markdown-footer">
      <span>支持标题和列表层级</span>
      <kbd>Ctrl</kbd><span>+</span><kbd>Enter</kbd><span>立即应用</span>
    </div>
  </section>

  <!-- 右侧面板 -->
  <aside id="sidebar">
    <div class="panel-section">
      <div class="panel-title">缩略图</div>
      <div id="minimap"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">大纲</div>
      <div id="outline"></div>
    </div>
    <div class="panel-section panel-tips">
      <div class="panel-title">快捷键</div>
      <div class="tip-row"><kbd>Tab</kbd> 子节点</div>
      <div class="tip-row"><kbd>Enter</kbd> 同级节点</div>
      <div class="tip-row"><kbd>F2</kbd> 编辑</div>
      <div class="tip-row"><kbd>Del</kbd> 删除</div>
      <div class="tip-row"><kbd>Space</kbd> 折叠</div>
      <div class="tip-row"><kbd>滚轮</kbd> 缩放</div>
      <div class="tip-row"><kbd>点击 / 拖动右侧 +</kbd> 拉出工作流连线</div>
    </div>
  </aside>

  <!-- 底部状态栏 -->
  <footer id="statusbar">
    <div class="status-left">
      <span id="status-info">双击空白处新建节点 · 双击节点编辑 · 拖拽移动 · 滚轮缩放 · Space+拖拽平移</span>
    </div>
    <div class="status-right">
      <span id="zoom-info">100%</span>
      <span class="dot">·</span>
      <span id="node-info">0 个节点</span>
    </div>
  </footer>

  <!-- 悬浮操作 -->
  <div id="floating-actions">
      <button class="fab" id="fab-fit" title="可读适配 (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V5a2 2 0 0 1 2-2h4 M15 3h4a2 2 0 0 1 2 2v4 M21 15v4a2 2 0 0 1-2 2h-4 M9 21H5a2 2 0 0 1-2-2v-4"/></svg>
    </button>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoom-out" title="缩小">−</button>
      <button class="zoom-btn reset" id="zoom-reset" title="重置视图">⌖</button>
      <button class="zoom-btn" id="zoom-in" title="放大">+</button>
    </div>
  </div>

  <input id="md-file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  <input id="json-file-input" type="file" accept=".json,application/json" hidden>

  <!-- 右键菜单 -->
  <div id="context-menu" class="context-menu hidden">
    <div class="ctx-item" data-action="add-child" role="menuitem" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>添加子节点</span>
      <em>Tab</em>
    </div>
    <div class="ctx-item" data-action="add-sibling" role="menuitem" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14 M12 5v14"/></svg>
      <span>添加同级节点</span>
      <em>Enter</em>
    </div>
    <div class="ctx-item" data-action="edit" role="menuitem" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <span>编辑</span>
      <em>F2</em>
    </div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" data-action="collapse" role="menuitem" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      <span>折叠 / 展开</span>
      <em>Space</em>
    </div>
    <div class="ctx-item ctx-danger" data-action="delete" role="menuitem" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      <span>删除节点</span>
      <em>Del</em>
    </div>
  </div>

  <!-- 拖拽提示 -->
  <div id="drag-hint" class="drag-hint hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4 M12 16h.01"/></svg>
    <span>松开鼠标挂到目标节点下</span>
  </div>

  <!-- 从节点输出端口拉到空白处时，先选择节点内容再创建 -->
  <div id="node-picker" class="node-picker hidden" role="dialog" aria-label="添加节点">
    <div class="node-picker-title">添加节点</div>
    <div class="node-picker-subtitle">节点会自动接到这根连线上</div>
    <input id="node-picker-input" type="text" maxlength="80" placeholder="输入节点名称" aria-label="节点名称">
    <div class="node-picker-actions">
      <button id="node-picker-cancel" type="button" class="ghost">取消</button>
      <button id="node-picker-create" type="button">创建节点</button>
    </div>
  </div>

  <!-- 提示气泡 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 节点底部浮动工具栏（选中时显示） -->
  <div id="node-toolbar" class="node-toolbar hidden">
    <button class="node-tool-btn" data-action="link" data-tip="从此处拉出连线">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="node-tool-btn" data-action="add-sibling" data-tip="添加同级节点">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="12" r="3"/><circle cx="16" cy="12" r="3"/><path d="M11 12h2"/></svg>
    </button>
    <button class="node-tool-btn" data-action="add-parent" data-tip="添加父级节点">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V9 M7 4l5 5 5-5"/></svg>
    </button>
    <button class="node-tool-btn" data-action="duplicate" data-tip="复制节点">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
    <button class="node-tool-btn" data-action="collapse" data-tip="折叠 / 展开">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="node-tool-btn danger" data-action="delete" data-tip="删除节点">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
